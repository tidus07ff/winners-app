<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winners for Life - Panel de Testeo y Edición</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sport: {
                            red: '#e60000',
                            dark: '#0f0f11',
                            accent: '#ff2222'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0b0b0e] text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-[#121215] border-b border-white/10 h-16 flex items-center justify-between px-6 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 flex items-center justify-center rounded-xl bg-sport-red text-white font-black text-lg shadow-lg transform -rotate-3">W</div>
            <h1 class="text-sm font-black tracking-wider uppercase italic">Winners for Life <span class="text-sport-red text-xs">Playground & Test</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="resetTexts()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg transition border border-white/10 flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Restaurar Original
            </button>
            <button onclick="copyAppCode()" class="px-3 py-1.5 bg-sport-red hover:bg-red-700 text-xs font-bold rounded-lg transition shadow-lg flex items-center gap-1.5">
                <i class="fa-solid fa-copy"></i> Copiar Código Modificado
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1600px] mx-auto w-full">
        
        <!-- Columna Izquierda: Editor de Textos y Secciones -->
        <div class="lg:col-span-6 flex flex-col gap-4">
            <div class="bg-[#18181b] border border-white/10 rounded-2xl p-5 shadow-xl flex flex-col h-[calc(100vh-130px)]">
                <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4 shrink-0">
                    <h2 class="font-bold text-base flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-sport-red"></i> Ventana de Edición de Textos
                    </h2>
                    <span class="text-[10px] bg-sport-red/20 text-sport-accent px-2 py-0.5 rounded-full font-bold uppercase">Modo Interactivo</span>
                </div>

                <!-- Selector de Sección a testear -->
                <div class="shrink-0 mb-4">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1.5">Seleccionar Sección para Editar:</label>
                    <select id="sectionSelector" onchange="switchEditorSection(this.value)" class="w-full bg-zinc-900 border border-zinc-700 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-sport-red text-white">
                        <option value="home">Pantalla de Inicio / Títulos</option>
                        <option value="noticias">Noticias Oficiales</option>
                        <option value="examenes">Exámenes de Cinto</option>
                        <option value="leccion">Lección de Vida (Autoestima)</option>
                        <option value="torneos">Calendario de Torneos</option>
                        <option value="juramentos">Juramentos ATA</option>
                    </select>
                </div>

                <!-- Contenedor dinámico de campos de texto -->
                <div id="editorFieldsContainer" class="flex-1 overflow-y-auto space-y-4 pr-2">
                    <!-- Rellenado dinámicamente por JS -->
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Vista Previa Simulada Estilo Smartphone -->
        <div class="lg:col-span-6 flex flex-col items-center justify-center">
            <div class="text-xs font-bold text-gray-400 uppercase mb-2 flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen-button text-green-400"></i> Vista Previa en Tiempo Real (Simulador)
            </div>
            
            <!-- Marco de Teléfono Móvil -->
            <div class="w-full max-w-[400px] h-[750px] bg-[#070709] border-[8px] border-zinc-800 rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col">
                <!-- Barra superior simulada -->
                <div class="h-14 bg-[#121215] border-b border-white/10 flex items-center justify-between px-4 shrink-0 z-10">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 flex items-center justify-center rounded-lg bg-sport-red text-white font-black text-xs">W</div>
                        <span id="previewHeaderTitle" class="text-xs font-black uppercase italic">WINNERS FOR LIFE</span>
                    </div>
                    <div class="text-[10px] text-gray-400 bg-white/5 px-2 py-0.5 rounded-full font-bold">Preview Live</div>
                </div>

                <!-- Pantalla interior interactiva -->
                <div id="previewCanvasContent" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
                    <!-- Contenido renderizado en vivo -->
                </div>

                <!-- Barra inferior simulada -->
                <div class="h-12 bg-[#121215] border-t border-white/10 flex items-center justify-around text-gray-400 text-xs shrink-0">
                    <button onclick="previewNavigate('home')" class="hover:text-sport-red transition"><i class="fa-solid fa-house text-sm"></i></button>
                    <button onclick="previewNavigate('noticias')" class="hover:text-sport-red transition"><i class="fa-regular fa-newspaper text-sm"></i></button>
                    <button onclick="previewNavigate('leccion')" class="hover:text-sport-red transition"><i class="fa-solid fa-heart text-sm"></i></button>
                    <button onclick="previewNavigate('examenes')" class="hover:text-sport-red transition"><i class="fa-solid fa-graduation-cap text-sm"></i></button>
                </div>
            </div>
        </div>

    </main>

    <!-- Notificación Toast de Copiado -->
    <div id="toastNotification" class="fixed bottom-6 right-6 bg-zinc-900 border border-green-500 text-green-400 px-4 py-3 rounded-xl shadow-2xl hidden items-center gap-2 text-xs font-bold animate-bounce z-50">
        <i class="fa-solid fa-circle-check text-base"></i> <span id="toastText">¡Texto copiado al portapapeles con éxito!</span>
    </div>

    <script>
        // Estado editable de textos de la app
        const appState = {
            home: {
                title: "WINNERS FOR LIFE",
                subtitle: "Disciplina · Autocontrol · Respeto",
                btnHorarios: "Horarios de Clases",
                btnNoticias: "Noticias Oficiales",
                btnExamenes: "Exámenes de Cinto"
            },
            noticias: {
                title: "Últimas Noticias",
                news1Date: "07 de Septiembre de 2026",
                news1Title: "Renovación en la Academia",
                news1Desc: "Pintamos la academia y le hicieron un increíble arte en sus paredes. ¡Te invitamos a conocer las nuevas instalaciones!",
                news2Title: "Entrega de Cinturones",
                news2Desc: "Celebramos la entrega de cinturones para todos los graduados que rindieron su examen hace unos días."
            },
            examenes: {
                title: "Exámenes de Cinto",
                datePocitos: "29 de Octubre - Sede Pocitos",
                dateBrazo: "30 de Octubre - Sede Brazo Oriental"
            },
            leccion: {
                title: "Lección de Vida",
                subtitle: "Autoestima",
                quote: "Que algo nos salga mal no significa que nosotros seamos malos.",
                closing: "Un error es algo que hiciste. No es lo que eres."
            },
            torneos: {
                title: "Calendario de Torneos",
                t1: "Torneo Nacional por Equipos",
                t2: "Torneo Panamericano (Mendoza)"
            },
            juramentos: {
                title: "Juramentos ATA",
                tigersText: "Señor! Para ser una buena persona necesito: conocimiento en la mente, honestidad en mi corazón..."
            }
        };

        let currentSection = 'home';

        window.addEventListener('DOMContentLoaded', () => {
            renderEditorFields();
            renderPreview();
        });

        function switchEditorSection(sectionKey) {
            currentSection = sectionKey;
            renderEditorFields();
            renderPreview();
        }

        function renderEditorFields() {
            const container = document.getElementById('editorFieldsContainer');
            container.innerHTML = '';
            
            const data = appState[currentSection];
            for (const [key, value] of Object.entries(data)) {
                const div = document.createElement('div');
                div.className = "bg-zinc-900/50 p-3.5 rounded-xl border border-white/5 space-y-1.5";
                
                const label = document.createElement('label');
                label.className = "block text-[11px] font-bold text-gray-400 uppercase tracking-wider";
                label.innerText = `Campo: ${key}`;
                
                const input = document.createElement('textarea');
                input.rows = value.length > 60 ? 3 : 1;
                input.className = "w-full bg-black/40 border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-sport-red transition";
                input.value = value;
                
                input.oninput = (e) => {
                    appState[currentSection][key] = e.target.value;
                    renderPreview();
                };

                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            }
        }

        function renderPreview() {
            const canvas = document.getElementById('previewCanvasContent');
            canvas.innerHTML = '';

            if (currentSection === 'home') {
                canvas.innerHTML = `
                    <div class="text-center py-6">
                        <div class="w-16 h-16 mx-auto flex items-center justify-center rounded-2xl bg-gradient-to-tr from-sport-red to-orange-600 text-white font-black text-2xl mb-3 shadow-lg transform rotate-3">W</div>
                        <h2 class="text-lg font-black uppercase italic">${appState.home.title}</h2>
                        <p class="text-[10px] uppercase font-bold text-gray-400 mt-1">${appState.home.subtitle}</p>
                    </div>
                    <div class="space-y-2">
                        <div class="bg-[#18181b] p-3 rounded-xl border border-white/10 font-bold flex justify-between items-center">
                            <span>${appState.home.btnHorarios}</span>
                            <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </div>
                        <div class="bg-[#18181b] p-3 rounded-xl border border-white/10 font-bold flex justify-between items-center">
                            <span>${appState.home.btnNoticias}</span>
                            <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </div>
                        <div class="bg-[#18181b] p-3 rounded-xl border border-white/10 font-bold flex justify-between items-center">
                            <span>${appState.home.btnExamenes}</span>
                            <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        </div>
                    </div>
                `;
            } else if (currentSection === 'noticias') {
                canvas.innerHTML = `
                    <h2 class="text-base font-black italic uppercase border-l-4 border-sport-red pl-2 mb-3">${appState.noticias.title}</h2>
                    <div class="bg-[#18181b] p-3 rounded-xl border-l-4 border-sport-red space-y-1">
                        <span class="text-[9px] text-sport-accent font-bold">${appState.noticias.news1Date}</span>
                        <h3 class="font-bold text-sm">${appState.noticias.news1Title}</h3>
                        <p class="text-[11px] text-gray-300 leading-relaxed">${appState.noticias.news1Desc}</p>
                    </div>
                `;
            } else if (currentSection === 'leccion') {
                canvas.innerHTML = `
                    <h2 class="text-base font-black italic uppercase border-l-4 border-pink-500 pl-2 mb-3">${appState.leccion.title}</h2>
                    <div class="bg-[#18181b] p-4 rounded-xl space-y-3">
                        <h3 class="text-lg font-black italic text-center">${appState.leccion.subtitle}</h3>
                        <div class="bg-black/30 p-3 rounded-lg border-l-4 border-pink-500 text-[11px] italic">
                            ${appState.leccion.quote}
                        </div>
                        <div class="bg-sport-red text-white p-3 rounded-lg text-center font-black text-[10px] uppercase">
                            ${appState.leccion.closing}
                        </div>
                    </div>
                `;
            } else {
                canvas.innerHTML = `
                    <h2 class="text-base font-black italic uppercase border-l-4 border-sport-red pl-2 mb-3">${appState[currentSection].title || 'Vista Previa'}</h2>
                    <div class="bg-[#18181b] p-4 rounded-xl space-y-2 text-[11px]">
                        <p class="font-bold">Contenido interactivo en prueba:</p>
                        <p class="text-gray-300">${JSON.stringify(appState[currentSection], null, 2)}</p>
                    </div>
                `;
            }
        }

        function previewNavigate(section) {
            document.getElementById('sectionSelector').value = section;
            switchEditorSection(section);
        }

        function copyAppCode() {
            const textToCopy = JSON.stringify(appState, null, 2);
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("¡Textos actualizados copiados al portapapeles!");
            } catch (err) {
                showToast("Error al copiar.");
            }
            document.body.removeChild(textarea);
        }

        function resetTexts() {
            location.reload();
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3000);
        }
    </script>
</body>
</html>
